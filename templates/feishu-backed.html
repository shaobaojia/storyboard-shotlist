<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
:root{--bg:#2b2b2b;--card:#222222;--border:#222222;--text:#e0e0e0;--head:#e0e0e0;--accent:#f43f5e;--green:#22c55e;--row-light:#3a3a3a;--row-dark:#333333}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}
.container{width:100%;padding:24px 32px}
.top{padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:0}
.top h1{color:var(--head);font-size:24px;font-weight:700}
.top h1 span{color:var(--accent)}
.sub{color:var(--text);font-size:14px;margin-top:6px}

/* ── Radio hiding ── */
input[name=scene],input[name^=sub-]{display:none}

/* ── Scene tabs ── */
.scene-section{display:none}
#scene-arc:checked~#arc-section{display:block}
{{SCENE_CSS}}
.scene-tabs{display:flex;gap:0;padding:0;background:var(--card);border-bottom:2px solid var(--accent);overflow-x:auto}
.scene-tabs label{display:block;padding:10px 16px;color:#888;font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;cursor:pointer;white-space:nowrap}
.scene-tabs label:hover{color:var(--head);background:rgba(255,255,255,.03)}
{{SCENE_TAB_ACTIVE_CSS}}

/* ── Sub-tabs ── */
.sub-tabs{display:flex;gap:0;padding:0;background:var(--bg);border-bottom:1px solid var(--border)}
.sub-tabs label{display:block;padding:8px 16px;color:var(--text);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;cursor:pointer}
.sub-tabs label:hover{color:var(--head)}
.sub-content{display:none;padding:16px 0}
{{SUB_TAB_CSS}}

/* ── Info bar ── */
.info-bar{display:flex;gap:24px;flex-wrap:wrap;padding:12px 0;margin-bottom:12px;border-bottom:1px solid var(--border);font-size:13px}
.info-bar span{color:var(--text)}
.info-bar b{color:var(--head)}
.info-bar .sep{color:var(--border);margin:0 4px}

/* ── v2 11-column table ── */
.scene-section table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;min-width:900px}
col.c1{width:42px}col.c2{width:72px}col.c3{width:160px}col.c4{width:110px}col.c5{width:90px}col.c6{width:auto;max-width:300px}col.c7{width:180px}col.c8{width:44px}col.c9{width:120px}col.c10{width:180px}col.c11{width:0}
/* 提示词列隐藏（数据供面板读取） */
th:nth-child(11),td:nth-child(11){width:0!important;padding:0!important;overflow:hidden!important;border:none!important;font-size:0!important;max-width:0!important}

thead th{background:var(--card);color:var(--head);padding:10px 6px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1;border-bottom:2px solid var(--accent);border-right:1px solid rgba(255,255,255,.12)}
tbody td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word;overflow-wrap:break-word}
tbody tr:nth-child(odd){background:var(--row-light)}tbody tr:nth-child(even){background:var(--row-dark)}
tbody tr:hover{background:rgba(244,63,94,.12)}
.prompt-row.clicked td{background:rgba(244,63,94,.12)!important}
tbody td:nth-child(1){white-space:nowrap}tbody td:nth-child(2){white-space:nowrap}tbody td:nth-child(4){white-space:nowrap;min-width:90px}tbody td:nth-child(5){white-space:nowrap}tbody td:nth-child(8){white-space:nowrap}
.c-num{color:var(--accent);font-weight:700;text-align:center}
tr.has-prompt .c-num::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:4px;vertical-align:middle}
.c-dur{text-align:center;white-space:nowrap;color:var(--green)}
.c-dialogue{color:#fbbf24}
.lens-tech{font-size:11px;color:var(--text);opacity:.35}
.audio-music{color:#fbbf24;font-size:12px}
.audio-sfx{color:#94a3b8;font-size:11px}
.c-notes{color:var(--text);font-size:12px}
.c-prompt{word-break:normal;white-space:pre-line;font-size:12px;line-height:1.5}

/* ── 编辑浮动栏 ── */
.edit-bar{display:none;position:sticky;top:0;z-index:50;background:var(--card);border-bottom:2px solid var(--accent);padding:8px 16px;justify-content:flex-end;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.edit-bar.show{display:flex}

/* ── 节拍分析表 ── */
.beat-decl{font-size:14px;color:var(--head);padding:12px 0 8px;font-weight:600}
.beat-rhythm{font-size:13px;color:var(--text);padding:8px 0}
.beat-estimate{font-size:14px;color:var(--accent);font-weight:700;padding:4px 0 16px}
.beat-analysis-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;min-width:700px}
.beat-analysis-table td,.beat-analysis-table th{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word}
.beat-analysis-table th{background:var(--card);color:var(--head);font-weight:600;font-size:12px;white-space:nowrap;border-bottom:2px solid var(--accent)}
.beat-analysis-table tbody tr:nth-child(odd){background:var(--row-light)}
.beat-analysis-table tbody tr:nth-child(even){background:var(--row-dark)}
.beat-analysis-table tbody tr:hover{background:rgba(244,63,94,.12)}
/* 外界动作+人物反应+说明 换行，其余不换 */
.beat-analysis-table td:nth-child(1){white-space:nowrap}
.beat-analysis-table td:nth-child(2){white-space:nowrap}
.beat-analysis-table td:nth-child(3){white-space:normal;word-break:break-word}
.beat-analysis-table td:nth-child(4){white-space:normal;word-break:break-word}
.beat-analysis-table td:nth-child(5){white-space:nowrap}
.beat-analysis-table td:nth-child(6){white-space:normal;word-break:break-word}
.beat-analysis-table td:nth-child(7){white-space:nowrap}
/* 列宽：外界动作+人物反应自动吃剩余 */
col.c1-b{width:36px}col.c2-b{width:90px}col.c3-b{width:auto}col.c4-b{width:auto}col.c5-b{width:120px}col.c6-b{width:auto}col.c7-b{width:60px}

/* ── 节拍属性标签 ── */
.prop-tag{display:inline-block;padding:0 3px;border-radius:2px;font-size:10px;font-weight:700;line-height:16px;margin-right:2px;vertical-align:middle}
.c-trigger{background:rgba(244,63,94,.15);color:var(--accent)}
.c-action{background:rgba(34,197,94,.12);color:var(--green)}
.c-react{background:rgba(251,191,36,.12);color:#fbbf24}
.c-estab{background:rgba(148,163,184,.12);color:#94a3b8}
.c-insert{background:rgba(167,139,250,.12);color:#a78bfa}

/* ── 提示词面板 ── */
.prompt-panel{position:fixed;top:40px;right:40px;width:500px;max-width:90vw;height:calc(100vh - 80px);max-height:calc(100vh - 80px);background:var(--card);border:1px solid var(--accent);z-index:100;display:none;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.4);border-radius:6px}
.prompt-panel.open{display:flex;animation:panelIn .35s cubic-bezier(.34,1.56,.64,1)}
.prompt-panel.dragging{box-shadow:-4px 0 30px rgba(0,0,0,.6)!important}
@keyframes panelIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes snapBounce{0%,100%{transform:scale(1)}40%{transform:scale(.92)}}
.snap-bounce{animation:snapBounce .25s ease}
.prompt-panel.pinned .prompt-overlay{display:none}
.prompt-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:99}
.prompt-overlay.show{display:block}
.prompt-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card);cursor:grab;user-select:none;flex-shrink:0}
.prompt-header:active{cursor:grabbing}
.prompt-header h3{color:var(--head);font-size:16px;margin:0}
.prompt-header .shot-meta{color:var(--accent);font-size:13px;font-weight:600;display:inline;vertical-align:baseline}
.prompt-close{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px}
.prompt-close:hover{color:var(--head)}
.prompt-body{flex:1;overflow-y:auto;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--text);min-height:100px;position:relative;scrollbar-width:thin;scrollbar-color:transparent transparent}
.prompt-body:hover{scrollbar-color:rgba(255,255,255,.15) transparent}
.prompt-body::-webkit-scrollbar{width:4px}
.prompt-body::-webkit-scrollbar-thumb{background:transparent;border-radius:2px;transition:background .3s}
.prompt-body:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}

.prompt-covered{font-size:12px;color:var(--green);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.prompt-inherit{font-size:11px;color:var(--accent);margin-bottom:12px}
.prompt-text{font-size:14px;line-height:2;color:#d4d4d4;white-space:pre-wrap;background:rgba(0,0,0,.15);border-radius:6px;padding:16px 18px;box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.03);outline:none;border:1px solid transparent;transition:border-color .2s}
.prompt-text.editing{border-color:rgba(245,158,11,.5)!important;background:rgba(245,158,11,.04)!important}
.prompt-line{margin-bottom:4px;line-height:1.9;font-size:14px}
.prompt-note{font-size:inherit;color:var(--accent);margin-left:4px}
.prompt-spacer{height:8px}
/* A: 实心小药丸 */
.prompt-badge-a{display:inline-block;padding:1px 7px;font-size:10px;font-weight:700;border-radius:10px;margin-right:6px;color:#111}
/* B: 左侧竖条 */
.prompt-line-b{border-left:3px solid;padding-left:10px;margin-bottom:4px}
.prompt-line-b .prompt-badge-b{font-size:11px;font-weight:700;margin-right:6px}
/* C: 微底高亮 */
.prompt-line-c{margin-bottom:4px}
.prompt-line-c .prompt-badge-c{font-size:12px;font-weight:700;margin-right:4px}
.prompt-line-c .prompt-badge-c::before{content:"● ";color:inherit;margin-right:2px}
.prompt-line-d{margin-bottom:4px}
.prompt-line-d .prompt-badge-d{font-size:13px;font-weight:700;margin-right:6px}
.prompt-body .lens-tech{font-size:11px;opacity:.35}
.prompt-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text);opacity:.3;font-size:15px}
.prompt-row{cursor:pointer}



/* 钉住按钮 */
.btn-pin{background:none;border:none;color:var(--text);font-size:16px;cursor:pointer;padding:4px 6px;opacity:.5;transition:all .2s}
/* Header buttons — unified */
.panel-btn{font-size:11px;padding:4px 8px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:#fff;cursor:pointer;transition:all .15s ease;line-height:1.4;white-space:nowrap;flex-shrink:0}
.panel-btn:hover{transform:translateY(-1px);background:transparent;color:var(--accent);border-color:var(--accent)}
.panel-btn.pinned{opacity:.7}
.ctx-menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 0;min-width:160px;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.ctx-item{padding:8px 14px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
.ctx-item:hover{background:rgba(244,63,94,.12);color:var(--head)}
.btn-close{border-color:var(--accent);background:var(--accent);font-size:16px;padding:2px 6px;color:#fff}
.btn-close:hover{background:transparent;color:var(--accent);border-color:var(--accent);transform:scale(1.1)}

/* 复制按钮弹跳 */
@keyframes copyBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.copy-bounce{animation:copyBounce .3s ease}

/* 正文淡入 */
.prompt-text.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes sidebarPulse{0%,100%{box-shadow:2px 0 12px rgba(244,63,94,.4)}50%{box-shadow:2px 0 24px rgba(244,63,94,.7)}}

/* ── Other tables ── */
.arc-table{width:100%;border-collapse:collapse;font-size:13px;margin:16px 0}
.arc-table th{background:var(--card);color:var(--head);padding:8px 6px;text-align:left;font-weight:600;font-size:12px;border-bottom:2px solid var(--accent)}
.arc-table td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.arc-table tr:nth-child(odd){background:var(--row-light)}
.arc-table tr:nth-child(even){background:var(--row-dark)}
.beat-table{width:100%;border-collapse:collapse;font-size:13px;margin:16px 0}
.beat-table th{background:var(--card);color:var(--head);padding:8px 6px;text-align:left;font-weight:600;font-size:12px;border-bottom:2px solid var(--accent);white-space:nowrap}
.beat-table td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
.beat-table tr:nth-child(odd){background:var(--row-light)}
.beat-table tr:nth-child(even){background:var(--row-dark)}
.beat-table .beat-red{color:var(--accent);font-weight:700}
.v1-beat{margin-bottom:28px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:6px}
.v1-beat h3{color:var(--head);font-size:15px;margin-bottom:8px}
.v1-beat .meta{font-size:12px;color:var(--text);margin-bottom:8px}
.v1-shot{margin:6px 0 6px 16px;font-size:13px;color:var(--text)}
.v1-shot .tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;margin-right:6px}
.tag-trigger{background:rgba(244,63,94,.15);color:var(--accent)}
.tag-action{background:rgba(34,197,94,.12);color:var(--green)}
.tag-react{background:rgba(251,191,36,.12);color:#fbbf24}
.tag-insert{background:rgba(167,139,250,.12);color:#a78bfa}
.tag-estab{background:rgba(148,163,184,.12);color:#94a3b8}
.placeholder{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text);font-size:18px;opacity:.4}
.placeholder-scene{display:flex;align-items:center;justify-content:center;height:300px;color:var(--text);font-size:18px;opacity:.3}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;-webkit-overflow-scrolling:touch}

/* ── Refresh button ── */
.btn-refresh{padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.btn-refresh:hover{opacity:.85}
.btn-refresh:disabled{opacity:.4;cursor:default}
.refresh-status{font-size:11px;margin-left:8px}
.refresh-status.ok{color:var(--green)}.refresh-status.err{color:var(--accent)}

/* ── Settings panel ── */
.settings-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:999;justify-content:center;align-items:center}
.settings-panel.show{display:flex}
.settings-box{background:var(--card);padding:24px;border-radius:8px;width:420px;max-width:90vw}
.settings-box h3{color:var(--head);margin-bottom:16px}
.settings-box label{display:block;color:var(--text);font-size:12px;margin:8px 0 4px}
.settings-box input{width:100%;padding:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:4px;font-size:13px}
.settings-box .btn-row{display:flex;gap:8px;margin-top:16px}
.settings-box button{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.btn-save{background:var(--accent);color:#fff}.btn-save:hover{opacity:.85}
.btn-cancel{background:var(--row-light);color:var(--text)}.btn-cancel:hover{background:var(--row-dark)}
.beat-section{margin-bottom:32px}
.beat-label{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:700;margin-right:8px}
.beat-dot{background:var(--row-light);color:var(--text)}
.beat-red{background:var(--accent);color:#fff}
.beat-title{color:var(--head);font-size:15px;font-weight:600;margin:8px 0 4px}
.beat-action,.beat-reaction{font-size:13px;color:var(--text);margin:2px 0;padding-left:12px;border-left:2px solid var(--border)}
.beat-action b,.beat-reaction b{color:var(--head)}
.beat-intent{font-size:13px;color:var(--green);margin-top:6px;font-style:italic}
.space-label{color:var(--green);font-size:13px;font-weight:600;margin-bottom:8px}
h2{color:var(--head);font-size:18px;margin:20px 0 12px}
h3{color:var(--head);font-size:15px;margin:16px 0 8px}
p,li{font-size:14px;margin:4px 0}
ul{padding-left:20px}

/* 调整大小手柄 */
.resize-handle{position:absolute;z-index:10}
.resize-handle.n,.resize-handle.s{left:8px;right:8px;height:6px}
.resize-handle.n{top:-3px;cursor:n-resize}
.resize-handle.s{bottom:-3px;cursor:s-resize}
.resize-handle.e,.resize-handle.w{top:8px;bottom:8px;width:6px}
.resize-handle.e{right:-3px;cursor:e-resize}
.resize-handle.w{left:-3px;cursor:w-resize}
.resize-handle.ne,.resize-handle.se,.resize-handle.sw,.resize-handle.nw{width:12px;height:12px}
.resize-handle.ne{top:-4px;right:-4px;cursor:ne-resize}
.resize-handle.se{bottom:-4px;right:-4px;cursor:se-resize}
.resize-handle.sw{bottom:-4px;left:-4px;cursor:sw-resize}
.resize-handle.nw{top:-4px;left:-4px;cursor:nw-resize}

/* 列宽拖拽 */
.col-resize{position:absolute;top:0;right:0;width:5px;height:100%;cursor:col-resize;z-index:1}
.col-resize:hover,.col-resize.active{background:var(--accent);opacity:.4}
th{position:relative}


/* 可折叠侧边栏 */
.sidebar{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:60;display:flex}
.sidebar-toggle{width:12px;min-height:36px;background:var(--accent);border:none;color:#fff;cursor:pointer;font-size:9px;font-weight:700;border-radius:0 3px 3px 0;padding:6px 2px;writing-mode:vertical-rl;letter-spacing:2px;box-shadow:1px 0 6px rgba(244,63,94,.3);animation:sidebarPulse 2s ease-in-out infinite;flex-shrink:0}
.sidebar-body{width:0;overflow:hidden;background:var(--card);border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;padding:0;display:flex;flex-direction:column;gap:8px;transition:width .3s ease,padding .3s ease;white-space:nowrap}
.sidebar.open .sidebar-body{width:48px;padding:8px}
.sidebar-body .btn-refresh{font-size:13px;padding:6px;width:32px;height:32px;text-align:center;white-space:nowrap;display:flex;align-items:center;justify-content:center}

</style>
</head>
<body>
<div class="container">
<header class="top">
<h1>{{TITLE}}</h1>
<div class="sub"><!-- 副标题 --></div>
</header>

{{SCENE_TABS}}

<!-- ═══ 价值弧线 ═══ -->
{{ARC_SECTION}}

{{SCENE_SECTIONS}}</section>


<!-- Prompt Panel -->
<div class="prompt-overlay" id="prompt-overlay" onclick="closePrompt()"></div>
<div class="prompt-panel" id="prompt-panel">
<div class="prompt-header">
<div><h3 style="margin:0;color:var(--head);font-size:16px;display:inline">提示词</h3><span class="shot-meta" id="prompt-shot-num" style="margin-left:8px"></span></div>
<div style="display:flex;gap:6px;align-items:center">
<button class="panel-btn" id="prompt-edit" onclick="toggleEdit()">编辑</button>
<button class="panel-btn" id="prompt-save" onclick="savePrompt()" style="display:none">💾 保存</button>
<button class="panel-btn" id="prompt-copy">复制</button>
<button class="panel-btn btn-close" onclick="closePrompt()">✕</button>
</div>
</div>
<div class="prompt-body" id="prompt-body">
<div class="prompt-empty">点击镜头行查看提示词</div>
</div>
</div>
</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctx-menu" style="display:none">
<div class="ctx-item" onclick="editCell()">编辑动作调度</div>
</div>

<!-- Beat Context Menu -->
<div class="ctx-menu" id="ctx-menu-beat" style="display:none">
<div class="ctx-item" onclick="editBeatRow()">编辑</div>
</div>

<!-- Settings Panel -->
<div id="settings-panel" class="settings-panel">
<div class="settings-box">
<h3>飞书 API 设置</h3>
<label>App ID</label>
<input id="cfg-app-id" placeholder="cli_xxx">
<label>App Secret</label>
<input id="cfg-app-secret" type="password" placeholder="••••">
<label>App Token（多维表格 URL 中 /base/ 后面那段）</label>
<input id="cfg-app-token" placeholder="OwBSbEQS...">
<label>Table ID（URL 中 ?table= 后面那段）</label>
<input id="cfg-table-id" placeholder="tbl2gBoyb...">
<div class="btn-row">
<button class="btn-save" onclick="saveSettings()">保存</button>
<button class="btn-cancel" onclick="closeSettings()">取消</button>
</div>
</div>
</div>

<script>
// Tab persistence
(function(){
  var sceneRadios = document.querySelectorAll('[name=scene]');
  var savedScene = localStorage.getItem('lastScene');
  if (savedScene) { var el = document.getElementById(savedScene); if (el) el.checked = true; }
  sceneRadios.forEach(function(r){ r.addEventListener('change', function(){ localStorage.setItem('lastScene', r.id); }); });
  var allSubGroups = document.querySelectorAll('[name^=sub-]');

async function refreshFromFeishu(){
  var cfg = getSettings();
  if (!cfg || !cfg.app_id) { openSettings(); return; }
  
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.disabled = true;
  var fb=document.getElementById('btn-refresh-float'); if(fb)fb.disabled=true;
  setStatus('连接中...', '');
  
  // Helper: call Feishu via local proxy (avoids CORS)
  async function feishuCall(url, headers, body) {
    var resp = await fetch('/api/feishu', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url, headers: headers || {}, body: body || null})
    });
    return resp.json();
  }
  
  try {
    // 1. Get token (via proxy)
    var tokenData = await feishuCall(
      'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
      {'Content-Type': 'application/json'},
      {app_id: cfg.app_id, app_secret: cfg.app_secret}
    );
    if (tokenData.code !== 0) throw new Error('Token: ' + tokenData.msg);
    var token = tokenData.tenant_access_token;
    
    // 2. Fetch records (via proxy)
    var allRecords = [];
    var pageToken = null;
    setStatus('拉取数据...', '');
    
    do {
      var feishuUrl = 'https://open.feishu.cn/open-apis/bitable/v1/apps/' + cfg.app_token + '/tables/' + cfg.table_id + '/records?page_size=50';
      if (pageToken) feishuUrl += '&page_token=' + pageToken;
      var data = await feishuCall(feishuUrl, {'Authorization': 'Bearer ' + token});
      if (data.code !== 0) throw new Error('Fetch: ' + data.msg);
      allRecords = allRecords.concat(data.data.items || []);
      pageToken = data.data.has_more ? data.data.page_token : null;
    } while (pageToken);
    
    setStatus('重建表格...', '');
    
    // 3. Normalize
    function norm(v){
      if (Array.isArray(v) && v.length && v[0].text !== undefined) {
        return v.map(function(x){return x.text}).join('');
      }
      return (v !== null && v !== undefined) ? String(v) : '';
    }
    
    var shots = [];
    allRecords.forEach(function(r){
      var f = r.fields || {};
      var s = {
        jinghao: norm(f['镜号']),
        yunjing: norm(f['运镜']),
        kongjian: norm(f['空间关系']),
        jingbie: norm(f['景别']),
        jiaoduan: norm(f['焦段']),
        jingshen: norm(f['景深']),
        jiwei: norm(f['机位']),
        dongzuo: norm(f['动作调度']),
        taici: norm(f['台词']),
        shichang: parseFloat(f['时长(秒)']) || 0,
        yinpin: norm(f['音频']),
        beizhu: norm(f['导演备注']),
        tishici: norm(f['提示词']),
        rid: r.record_id,
        beatNum: norm(f['beat序号']),
        beatType: norm(f['beat类型']),
        beatTitle: norm(f['beat标题']),
        scene: norm(f['场次']),
        beatAction: norm(f['节拍动作'])
      };
      if (s.jinghao) shots.push(s);
    });
    shots.sort(function(a,b){ return a.jinghao.localeCompare(b.jinghao, undefined, {numeric:true}); });
    
    // 4. Group shots by scene
    var scenes = {}; var sceneOrder = [];
    shots.forEach(function(s){ var sid = s.scene || 's010'; if(!scenes[sid]){scenes[sid]=[];sceneOrder.push(sid);} scenes[sid].push(s); });
    if (sceneOrder.length === 0) { sceneOrder = ['s010']; scenes['s010'] = []; }
    
    // 5. Build beat-grouped HTML per scene
    function buildRow(s){
      var raw = s.jingbie.trim();
      var lensMatch = raw.match(/(\d+mm·(?:浅|中|深)(?:→(?:浅|中|深))?)/);
      var lensHtml = lensMatch ? '<br><span class="lens-tech">' + lensMatch[1] + '</span>' : '';
      var framing = lensMatch ? (raw.substring(0, lensMatch.index) + raw.substring(lensMatch.index + lensMatch[0].length)).trim() : raw;
      var sheyingji = framing.indexOf('↓') !== -1 ? framing.split('↓')[0].trim() + '<br>↓<br>' + framing.split('↓')[1].trim() + lensHtml : framing + lensHtml;
      var yinpin = s.yinpin, audioHtml;
      if (yinpin && yinpin.trim() && yinpin.trim() !== '—') audioHtml = '<span class="audio-sfx">' + yinpin.replace(/\n/g,'<br>') + '</span>';
      else audioHtml = '<span class="audio-music">—</span>';
      var dur = s.shichang ? Math.round(s.shichang) + 's' : '';
      var taiciHtml = s.taici ? '<td class="c-dialogue">' + s.taici + '</td>' : '<td></td>';
      var hasPrompt = s.tishici && String(s.tishici).trim();
      return '<tr' + (hasPrompt ? ' class="has-prompt"' : '') + ' data-record-id="' + (s.rid||'') + '"><td class="c-num">' + s.jinghao + '</td><td>' + s.yunjing + '</td><td>' + formatKongjian(s.kongjian) + '</td><td>' + sheyingji + '</td><td>' + (JIWEI_SHORT[s.jiwei]||s.jiwei) + '</td><td>' + s.dongzuo + '</td>' + taiciHtml + '<td class="c-dur">' + dur + '</td><td>' + audioHtml + '</td><td class="c-notes">' + s.beizhu + '</td><td class="c-prompt">' + s.tishici + '</td></tr>';
    }
    
    var th = '<thead><tr><th>#</th><th>运镜</th><th>空间关系</th><th>摄影机</th><th>机位</th><th>动作调度</th><th>台词</th><th>时长</th><th>音频</th><th>导演备注</th><th>提示词</th></tr></thead>';
    var cg = '<colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7"><col class="c8"><col class="c9"><col class="c10"><col class="c11"></colgroup>';
    
    // 6. Replace scene containers
    var totalAllShots = 0, totalAllDur = 0;
    sceneOrder.forEach(function(sid){
      var sceneShots = scenes[sid] || [];
      var groups = {}; var order = [];
      sceneShots.forEach(function(s){ var k = s.beatNum||'_'; if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(s); });
      var blocks = [];
      order.forEach(function(k){
        var gs = groups[k]; var b = gs[0];
        if(k === '空间' || k === '_' && !b.beatType){
          blocks.push('<div class="beat-section"><div class="space-label">▸ 空间建立镜 (' + gs.length + ' 镜)</div><div class="table-wrap"><table>' + cg + th + '<tbody>' + gs.map(buildRow).join('') + '</tbody></table></div></div>');
        } else {
          var lc = b.beatType.indexOf('戏点')!==-1 ? 'beat-red' : 'beat-dot';
          var block = '<div class="beat-section"><span class="beat-label ' + lc + '">' + b.beatType + '</span><span class="beat-title">beat ' + k + '：' + b.beatTitle + ' (' + gs.length + ' 镜)</span>';
          if(b.beatAction){
            var parts = b.beatAction.split('→');
            block += '<div class="beat-action">' + parts[0].trim() + (parts.length>1?'<br>'+parts[1].trim():'') + '</div>';
          }
          block += '<div class="table-wrap"><table>' + cg + th + '<tbody>' + gs.map(buildRow).join('') + '</tbody></table></div></div>';
          blocks.push(block);
        }
      });
      var container = document.getElementById('v2-' + sid);
      if (container) { container.innerHTML = blocks.join(''); }
      totalAllShots += sceneShots.length;
      totalAllDur += sceneShots.reduce(function(a,s){return a + (s.shichang||0)}, 0);
    });
    
    if (totalAllShots === 0) {
      setStatus('无数据，请检查飞书表格', 'err');
      if (btn) btn.disabled = false; var fb=document.getElementById('btn-refresh-float'); if(fb)fb.disabled=false;
      return;
    }
    
    // Update stats for active scene
    var activeSid = getActiveScene();
    var activeShots = scenes[activeSid] || [];
    if (activeSid === 'arc') activeShots = shots;
    var activeDur = activeShots.reduce(function(a,s){return a + (s.shichang||0)}, 0);
    setStatus(activeShots.length + '镜 ' + Math.floor(activeDur/60) + '′' + Math.round(activeDur%60) + '″', 'ok');
    
    // Re-attach prompt click handlers
    setTimeout(attachPromptClicks, 200);
    
    // Update info bar stats for active scene
    var infoBar = document.querySelector('#' + activeSid + '-section .info-bar');
    if (!infoBar) infoBar = document.querySelector('.info-bar');
    if (infoBar && infoBar.children.length >= 2) {
      infoBar.children[1].innerHTML = '总镜数 <b>' + activeShots.length + '</b>';
      if (infoBar.children.length >= 3) {
        infoBar.children[2].innerHTML = '总时长 <b>' + Math.floor(activeDur/60) + '′' + Math.round(activeDur%60) + '″</b>';
      }
    }
    
    // Rebuild static HTML in background (so F5 shows latest data)
    fetch('/api/rebuild').catch(function(){});
    
  } catch(e) {
    setStatus('失败: ' + e.message, 'err');
  } finally {
    if (btn) btn.disabled = false; var fb=document.getElementById('btn-refresh-float'); if(fb)fb.disabled=false;
  }
}

// ── 提示词面板 ──
var currentShotData = null;

function openPrompt(shotNum, rowElement) {
  // Reset editing state
  _isEditing = false;
  var editBtn = document.getElementById("prompt-edit");
  var saveBtn = document.getElementById("prompt-save");
  if (editBtn) { editBtn.style.display = ""; }
  if (saveBtn) { saveBtn.style.display = "none"; saveBtn.textContent = "保存"; saveBtn.disabled = false; }
  var row = rowElement || document.querySelector('[data-shot="' + shotNum + '"]');
  if (!row) return;
  
  var cells = row.querySelectorAll('td');
  var promptRaw = cells.length >= 11 ? cells[10].textContent.trim() : '';
  var promptText = '';
  var sourceShot = shotNum;
  var visited = {};
  
  // Follow ←scene-NN or ←NN chain
  while (promptRaw) {
    var inheritMatch = promptRaw.match(/^[↑←]\s*(?:(\w+)-)?(\d+)$/);
    if (inheritMatch) {
      var target = inheritMatch[2];
      if (visited[target]) break;
      visited[target] = true;
      sourceShot = target;
      var targetRow = document.querySelector('[data-shot="' + target + '"]');
      if (targetRow) {
        var targetCells = targetRow.querySelectorAll('td');
        promptRaw = targetCells.length >= 11 ? targetCells[10].textContent.trim() : '';
      } else {
        promptText = '(未找到镜' + target + ')';
        break;
      }
    } else {
      promptText = promptRaw;
      break;
    }
  }
  
  currentShotData = {promptText: promptText, sourceShot: sourceShot, recordId: (row.getAttribute('data-record-id')||''),
    targetRecordId: (sourceShot !== shotNum ? (document.querySelector('[data-shot="' + sourceShot + '"]')||{}).getAttribute('data-record-id')||'' : '')};
  
  // Highlight all shots sharing same prompt + collect covered shots
  document.querySelectorAll('.prompt-row.clicked').forEach(function(r){r.classList.remove('clicked')});
  var coveredShots = [shotNum];
  if (promptText) {
    var rootSource = sourceShot !== shotNum ? sourceShot : shotNum;
    document.querySelectorAll('#v2-' + getActiveScene() + ' .prompt-row').forEach(function(r){
      var rc = r.querySelectorAll('td');
      if (rc.length < 11) return;
      var rp = rc[10].textContent.trim();
      var sn = r.getAttribute('data-shot');
      if (sn === shotNum) { r.classList.add('clicked'); return; }  // highlight self, skip double-count
      if (sn === rootSource) { r.classList.add('clicked'); coveredShots.push(sn); return; }
      var m = rp.match(/^[↑←]\s*(?:\w+-)?(\d+)$/);
      if (m && m[1] === rootSource) { r.classList.add('clicked'); coveredShots.push(sn); }
    });
  }
  coveredShots.sort(function(a,b){return parseInt(a)-parseInt(b)});
  var coveredLabel = '镜 ' + coveredShots.join(', ');
  document.getElementById('prompt-shot-num').textContent = coveredLabel;
  
  var body = document.getElementById('prompt-body');
  if (promptText) {
    var inheritNote = sourceShot !== shotNum ? '<div class="prompt-inherit">↑ 继承自 镜' + sourceShot + '</div>' : '';
    // Parse 演/拍/呈 blocks
    var blocks = parsePromptBlocks(promptText);
    
    body.innerHTML = '' +
      '' +
      inheritNote +
      '<div class="prompt-text fade-in">' + blocks + '</div>';
  } else {
    body.innerHTML = '<div class="prompt-empty">暂无提示词</div>';
  }
  
  // Copy button handler (may not exist if no prompt text)
  var copyBtn = document.getElementById('prompt-copy');
  if (copyBtn) { copyBtn.onclick = function(){
    var text = (currentShotData && currentShotData.promptText || '').replace(/\[.*?\]/g, '').trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        var btn = document.getElementById('prompt-copy');
        btn.textContent = '✓ 已复制'; bounceCopyBtn();
        setTimeout(function(){ btn.textContent = '复制'; }, 2000);
      }).catch(function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  };
  }
  
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text.replace(/\[.*?\]/g, '').trim();
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    var btn = document.getElementById('prompt-copy');
    btn.textContent = '✓ 已复制'; bounceCopyBtn();
    setTimeout(function(){ btn.textContent = '复制'; }, 2000);
  }
  
  var panelEl = document.getElementById('prompt-panel');
  panelEl.classList.add('open');
  panelEl._restoreState();
  if (!panelEl.classList.contains('pinned')) {
    document.getElementById('prompt-overlay').classList.add('show');
  }
}
function formatKongjian(text) {
  return text.replace(/\n/g, '<br>').replace(/\[/g, '<wbr>[');
}
function parsePromptBlocks(text) {
  // Style assignments: A=药丸(场景/人物), B=竖条(空间锚/镜头), C=微底(其余)
  var styleMap = {'空间关系':'D','画面动态':'D','动作表演':'D','拍摄方式':'D','画面呈现':'D','主光方位':'D'};
  var colors = {
    '场景':'#f59e0b','空间关系':'#94a3b8','空间锚':'#3b82f6','人物':'#10b981','道具':'#3b82f6','镜头':'#a78bfa','动作表演':'#94a3b8','拍摄方式':'#94a3b8','画面动态':'#94a3b8','画面呈现':'#94a3b8',
    '视角':'#10b981','光线':'#f59e0b','调色':'#ec4899',
    '氛围':'#8b5cf6','时长':'#6b7280','景别':'#f43f5e',
    '焦段':'#3b82f6','景深':'#10b981','机位':'#f59e0b',
    '运镜':'#a78bfa','风格':'#8b5cf6','风格块':'#22d3ee','主光方位':'#94a3b8','@图片':'#6b7280'
  };
  var headingRe = /^(场景|空间关系|空间锚|人物|道具|镜头[一二三四五六七八九十\d]+|动作表演|拍摄方式|画面动态|画面呈现|主光方位|视角|光线|调色|氛围|风格|风格块|时长|景别|焦段|景深|机位|运镜)[：:\uff1a]/;
  var lines = text.split(/[\n\r]+/);
  var result = '';
  for (var i=0;i<lines.length;i++){
    var line = lines[i];
    var m = line.match(headingRe);
    if (m) {
      var key = m[1];
      if (key.indexOf('@图片')===0) key = '@图片';
      else if (/^镜头[一二三四五六七八九十\d]+$/.test(key)) key = '镜头';
      var color = colors[key]||'#6b7280';
      var style = styleMap[key]||'C';
      var body = line.substring(m[0].length).replace(/</g,'&lt;').replace(/\[(.*?)\]/g, '<span class="prompt-note">[$1]</span>');
      
      if (style === 'A') {
        result += '<div class="prompt-line"><span class="prompt-badge-a" style="background:'+color+'">'+m[1]+'</span> '+body+'</div>';
      } else if (style === 'B') {
        result += '<div class="prompt-line-b" style="border-color:'+color+'"><span class="prompt-badge-b" style="color:'+color+'">'+m[1]+'</span> '+body+'</div>';
      } else if (style === 'D') {
        result += '<div class="prompt-line-d"><span class="prompt-badge-d" style="color:'+color+'">'+m[1]+'</span> '+body+'</div>';
      } else {
        result += '<div class="prompt-line-c"><span class="prompt-badge-c" style="color:'+color+'">'+m[1]+'</span> '+body+'</div>';
      }
    } else if (line.trim()) {
      result += '<div class="prompt-line">'+line.replace(/</g,'&lt;').replace(/\[(.*?)\]/g, '<span class="prompt-note">[$1]</span>')+'</div>';
    } else {
      result += '<div class="prompt-spacer"></div>';
    }
  }
  return result;
}

// 拖拽 + 调整大小 + 钉住
(function(){
  var p = document.getElementById('prompt-panel'); if(!p) return;
  var header = p.querySelector('.prompt-header');
  var MIN_W=320,MIN_H=200;
  
  // Drag
  var dX=0,dY=0,dragging=false;
  header.addEventListener('mousedown',function(e){
    if(e.target.closest('button')) return;
    dragging=true; dX=e.clientX-p.offsetLeft; dY=e.clientY-p.offsetTop;
    p.classList.add('dragging');
    p.style.cursor='grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(dragging){
      var x=e.clientX-dX, y=e.clientY-dY;
      x=Math.max(0,Math.min(window.innerWidth-p.offsetWidth-20,x));
      y=Math.max(0,Math.min(window.innerHeight-p.offsetHeight-10,y));
      p.style.left=x+'px'; p.style.top=y+'px'; p.style.right='auto';
      return;
    }
    // Resize logic
    if(!resizing)return;
    var dx=e.clientX-resizeStart.x, dy=e.clientY-resizeStart.y;
    var r=resizing; // {dir:'n','s','e','w','ne','nw','se','sw'}
    
    if(r.dir.indexOf('e')!==-1){
      var nw=Math.max(MIN_W,resizeStart.w+dx);
      p.style.width=nw+'px';
    }
    if(r.dir.indexOf('w')!==-1){
      var nw=Math.max(MIN_W,resizeStart.w-dx);
      p.style.width=nw+'px';
      p.style.left=(resizeStart.l+dx)+'px'; p.style.right='auto';
    }
    if(r.dir.indexOf('s')!==-1){
      p.style.height=Math.max(MIN_H,resizeStart.h+dy)+'px';
    }
    if(r.dir.indexOf('n')!==-1){
      var nh=Math.max(MIN_H,resizeStart.h-dy);
      p.style.height=nh+'px';
      p.style.top=(resizeStart.t+dy)+'px';
    }
  });
  document.addEventListener('mouseup',function(){
    if(dragging){dragging=false;p.style.cursor='';p.classList.remove('dragging');}
    if(resizing){resizing=null;}
    if(p._saveState)p._saveState();
  });
  
  // Resize handles
  var resizing=null,resizeStart={};
  ['n','s','e','w','ne','nw','se','sw'].forEach(function(dir){
    var h=document.createElement('div');
    h.className='resize-handle '+dir;
    h.addEventListener('mousedown',function(e){
      resizing={dir:dir};
      resizeStart={x:e.clientX,y:e.clientY,l:p.offsetLeft,t:p.offsetTop,w:p.offsetWidth,h:p.offsetHeight};
      e.preventDefault(); e.stopPropagation();
    });
    p.appendChild(h);
  });
  
  // Save/restore state
  p._saveState = function(){
    this._left=this.style.left||''; this._top=this.style.top||'';
    this._width=this.style.width||''; this._height=this.style.height||'';
  };
  p._restoreState = function(){
    if(this._left){
      if(this._left==='auto'){this.style.right=this._right||'8px';this.style.left='auto';}
      else{this.style.left=this._left;this.style.right='auto';}
      this.style.top=this._top||'40px';
    }
    if(this._width)this.style.width=this._width;
    if(this._height)this.style.height=this._height;
  };
  p._saveState = function(){
    this._left=this.style.left||''; this._right=this.style.right||'';
    this._top=this.style.top||''; this._width=this.style.width||''; this._height=this.style.height||'';
  };
  
  // Pin button
  var b=document.createElement('button');b.className='panel-btn';b.textContent='钉住';b.title='钉住面板';
  var hr=p.querySelector('.prompt-header>div:last-child');if(hr)hr.insertBefore(b,hr.firstChild);
  b.onclick=function(){var pn=p.classList.toggle('pinned');b.classList.toggle('pinned',pn);
    if(!pn)document.getElementById('prompt-overlay').classList.add('show');
    else document.getElementById('prompt-overlay').classList.remove('show');};

  // Snap buttons
  function snap(dir){
    if(dir==='right'){
      p.style.left='auto'; p.style.right='8px'; p.style.top='40px';
      p.style.height=(window.innerHeight-80)+'px'; p.style.width='500px';
    } else {
      p.style.left='40px'; p.style.right='40px'; p.style.top='auto'; p.style.bottom='8px'; p.style.width='auto'; p.style.height='45vh'; p.style.maxWidth='none';
    }
    p._saveState();
  }
  ['right','bottom'].forEach(function(d){
    var sb=document.createElement('button');sb.className='panel-btn';
    sb.textContent={'right':'右贴附','bottom':'下贴附'}[d];sb.title='贴靠'+(d==='right'?'右侧':'下侧');
    
    sb.onclick=function(e){snap(d);sb.classList.add('snap-bounce');setTimeout(function(){sb.classList.remove('snap-bounce');},250);e.stopPropagation();};
    hr.insertBefore(sb,hr.firstChild);
  });
})();
(function(){
  document.querySelectorAll('.scene-section .sub-content table thead').forEach(bindColResize);
})();

function bounceCopyBtn(){
  var b=document.getElementById('prompt-copy');if(!b)return;
  b.classList.remove('copy-bounce');void b.offsetWidth;b.classList.add('copy-bounce');
}


var _isEditing = false;
function toggleEdit(){
  var body = document.getElementById('prompt-body');
  var txt = body.querySelector('.prompt-text');
  var editBtn = document.getElementById('prompt-edit');
  var saveBtn = document.getElementById('prompt-save');
  if (!txt) return;
  
  if (!_isEditing){
    // Replace HTML-formatted prompt with plain text for editing
    txt.innerHTML = '';
    txt.textContent = currentShotData.promptText;
    txt.contentEditable = 'true';
    txt.classList.add('editing');
    txt.focus();
    editBtn.style.display = 'none';
    saveBtn.style.display = '';
    _isEditing = true;
  }
}
function savePrompt(){
  var txt = document.getElementById('prompt-body').querySelector('.prompt-text');
  if (!txt) return;
  var newText = txt.innerText.trim();
  var editBtn = document.getElementById('prompt-edit');
  var saveBtn = document.getElementById('prompt-save');
  
  // Get the source shot's record_id (inherited shot → save to source)
  var rid = currentShotData.targetRecordId || currentShotData.recordId;
  if (!rid) { alert('无法保存：缺少记录ID，请先点🔄从飞书刷新'); return; }
  
  saveBtn.textContent = '保存中...'; saveBtn.disabled = true;
  
  var cfg = JSON.parse(localStorage.getItem('feishu_cfg')||'{}');
  if (!cfg.app_id) { alert('请先配置飞书API设置'); return; }
  
  fetch('/api/feishu',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',headers:{'Content-Type':'application/json'},body:{app_id:cfg.app_id,app_secret:cfg.app_secret}})
  }).then(function(r){return r.json()}).then(function(td){
    var token = td.tenant_access_token;
    return fetch('/api/feishu',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:'https://open.feishu.cn/open-apis/bitable/v1/apps/'+cfg.app_token+'/tables/'+cfg.table_id+'/records/'+rid,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:{fields:{'提示词':newText}},_method:'PUT'})
    });
  }).then(function(r){return r.json()}).then(function(d){
    if (d.code===0){
      txt.contentEditable = 'false';
      txt.classList.remove('editing');
      editBtn.style.display = ''; saveBtn.style.display = 'none';
      saveBtn.textContent = '💾 保存'; saveBtn.disabled = false;
      _isEditing = false;
      // Update cached text + DOM data
      currentShotData.promptText = newText;
      var srcRow = document.querySelector('[data-shot="' + currentShotData.sourceShot + '"]');
      if (srcRow){ var tds=srcRow.querySelectorAll('td'); if(tds.length>=11) tds[10].textContent=newText; }
      // Flash save button
      saveBtn.style.display = ''; saveBtn.textContent = '✅ 已保存';
      setTimeout(function(){ saveBtn.style.display = 'none'; saveBtn.textContent = '💾 保存'; }, 2000);
    } else {
      alert('保存失败: ' + (d.msg||'未知错误'));
      saveBtn.textContent = '💾 保存'; saveBtn.disabled = false;
    }
  }).catch(function(e){
    alert('保存失败: ' + e.message);
    saveBtn.textContent = '💾 保存'; saveBtn.disabled = false;
  });
}
var _ctxRow = null;
function showCtxMenu(e, row){
  e.preventDefault();
  _ctxRow = row;
  var inBeat = row.closest('[id^="beat-"]');
  var menuId = inBeat ? "ctx-menu-beat" : "ctx-menu";
  var otherId = inBeat ? "ctx-menu" : "ctx-menu-beat";
  document.getElementById(otherId).style.display = "none";
  var menu = document.getElementById(menuId);
  menu.style.display = "block";
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
}
function hideCtxMenu(){
  var m = document.getElementById("ctx-menu"); if(m) m.style.display = "none";
  var mb = document.getElementById("ctx-menu-beat"); if(mb) mb.style.display = "none";
}
document.addEventListener("click", function(e){
  if (!e.target.closest(".ctx-menu") && !e.target.closest("#ctx-menu-beat")) hideCtxMenu();
});

function editCell(){
  hideCtxMenu();
  if (!_ctxRow) return;
  // If already editing, just focus the textarea
  var existingTa = _ctxRow.querySelector("td textarea");
  if (existingTa) { existingTa.focus(); return; }
  var cells = _ctxRow.querySelectorAll("td");
  if (cells.length < 11) return;
  var td = cells[5];
  var rid = _ctxRow.getAttribute("data-record-id");
  if (!rid) { alert("请先点从飞书刷新"); return; }
  
  var orig = td.textContent.trim();
  var ta = document.createElement("textarea");
  ta.value = orig;
  ta.style.cssText = "width:100%;min-height:80px;background:var(--bg);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:6px;font:13px/1.5 sans-serif;resize:vertical;box-sizing:border-box";
  var btnRow = document.createElement("div");
  btnRow.style.cssText = "display:flex;gap:6px;margin-top:4px";
  var saveBtn = document.createElement("button");
  saveBtn.textContent = "保存"; saveBtn.className = "panel-btn";
  var cancelBtn = document.createElement("button");
  cancelBtn.textContent = "取消"; cancelBtn.className = "panel-btn";
  cancelBtn.style.cssText = "background:var(--row-light);color:var(--text);border-color:var(--border)";
  
  td.textContent = "";
  td.appendChild(ta);
  td.appendChild(btnRow);
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  ta.focus();
  
  cancelBtn.onclick = function(e){ e.stopPropagation(); td.textContent = orig; };
  
  saveBtn.onclick = function(e){
    e.stopPropagation();
    var cfg = JSON.parse(localStorage.getItem("feishu_cfg")||"{}");
    if (!cfg.app_id) { alert("请先配置飞书API设置"); return; }
    saveBtn.disabled = true; saveBtn.textContent = "保存中...";
    fetch("/api/feishu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:"https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",headers:{"Content-Type":"application/json"},body:{app_id:cfg.app_id,app_secret:cfg.app_secret}})})
    .then(function(r){return r.json()}).then(function(td2){
      var token = td2.tenant_access_token;
      return fetch("/api/feishu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:"https://open.feishu.cn/open-apis/bitable/v1/apps/"+cfg.app_token+"/tables/"+cfg.table_id+"/records/"+rid,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:{fields:{"动作调度":ta.value.trim()}},_method:"PUT"})});
    }).then(function(r){return r.json()}).then(function(d){
      if (d.code===0) { td.textContent = ta.value.trim(); }
      else { td.textContent = orig; alert("保存失败: "+(d.msg||"")); }
    }).catch(function(e){ td.textContent = orig; alert("保存失败: "+e.message); });
  };
}

// ── Beat Row Editing State ──
var _editState = null; // {cells, editCols, originals, textareas, rid}

function editBeatRow(){
  hideCtxMenu();
  if (!_ctxRow) return;
  if (_editState) { _editState.textareas[1].focus(); return; }
  var cells = _ctxRow.querySelectorAll("td");
  if (cells.length < 7) return;
  var rid = _ctxRow.getAttribute("data-record-id");
  if (!rid) { alert("请先点从飞书刷新"); return; }
  
  var editCols = [
    {idx:1, field:"节拍名称"},
    {idx:2, field:"外界动作"},
    {idx:3, field:"人物反应"},
    {idx:5, field:"说明"}
  ];
  var originals = {};
  var textareas = {};
  
  editCols.forEach(function(c){
    var td = cells[c.idx];
    originals[c.idx] = td.textContent.trim();
    td.textContent = "";
    var ta = document.createElement("textarea");
    ta.value = originals[c.idx];
    ta.style.cssText = "width:100%;min-height:60px;background:var(--bg);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:6px;font:13px/1.5 sans-serif;resize:vertical;box-sizing:border-box";
    td.appendChild(ta);
    textareas[c.idx] = ta;
  });
  
  _editState = {cells:cells, editCols:editCols, originals:originals, textareas:textareas, rid:rid};
  
  // Inject sticky edit bar into the active sub-content container
  var container = _ctxRow.closest(".sub-content");
  var bar = container.querySelector(".edit-bar");
  if (!bar) {
    bar = document.createElement("div");
    bar.className = "edit-bar";
    bar.innerHTML = '<button class="panel-btn edit-bar-cancel" style="background:var(--row-light);color:var(--text);border-color:var(--border)">取消</button><button class="panel-btn edit-bar-save">保存</button>';
    bar.querySelector(".edit-bar-cancel").onclick = cancelEdit;
    bar.querySelector(".edit-bar-save").onclick = saveEdit;
    container.insertBefore(bar, container.firstChild);
  }
  bar.classList.add("show");
  textareas[1].focus();
}

function cancelEdit(){
  if (!_editState) return;
  var s = _editState;
  s.editCols.forEach(function(c){ s.cells[c.idx].textContent = s.originals[c.idx]; });
  _editState = null;
  var bar = s.cells[0].closest(".sub-content").querySelector(".edit-bar");
  if (bar) bar.classList.remove("show");
}

function saveEdit(){
  if (!_editState) return;
  var s = _editState;
  var saveBtn = document.querySelector(".edit-bar.show .edit-bar-save");
  if (!saveBtn) return;
  saveBtn.disabled = true; saveBtn.textContent = "保存中...";
  
  var cfg = JSON.parse(localStorage.getItem("feishu_cfg")||"{}");
  if (!cfg.app_id) { alert("请先配置飞书API设置"); saveBtn.disabled = false; saveBtn.textContent = "保存"; return; }
  
  var fields = {};
  s.editCols.forEach(function(c){ fields[c.field] = s.textareas[c.idx].value.trim(); });
  
  fetch("/api/feishu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:"https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",headers:{"Content-Type":"application/json"},body:{app_id:cfg.app_id,app_secret:cfg.app_secret}})})
  .then(function(r){return r.json()}).then(function(td2){
    var token = td2.tenant_access_token;
    return fetch("/api/feishu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:"https://open.feishu.cn/open-apis/bitable/v1/apps/"+cfg.app_token+"/tables/tbl9L7UG4kJ2nuSr/records/"+s.rid,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:{fields:fields},_method:"PUT"})});
  }).then(function(r){return r.json()}).then(function(d){
    if (d.code===0){
      s.editCols.forEach(function(c){ s.cells[c.idx].textContent = s.textareas[c.idx].value.trim(); });
    } else {
      s.editCols.forEach(function(c){ s.cells[c.idx].textContent = s.originals[c.idx]; });
      alert("保存失败: "+(d.msg||""));
    }
    _editState = null;
    var bar2 = s.cells[0].closest(".sub-content").querySelector(".edit-bar");
    if (bar2) bar2.classList.remove("show");
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "保存"; }
  }).catch(function(e){
    s.editCols.forEach(function(c){ s.cells[c.idx].textContent = s.originals[c.idx]; });
    alert("保存失败: "+e.message);
    _editState = null;
    var bar2 = s.cells[0].closest(".sub-content").querySelector(".edit-bar");
    if (bar2) bar2.classList.remove("show");
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "保存"; }
  });
}




function closePrompt() {
  var panel = document.getElementById('prompt-panel');
  // X button always closes — unpin first
  panel.classList.remove('pinned');
  var pb = panel.querySelector('.btn-pin');
  if (pb) pb.classList.remove('pinned');
  panel._saveState();
  panel.classList.remove('open');
  document.getElementById('prompt-overlay').classList.remove('show');
  document.querySelectorAll('.prompt-row.clicked').forEach(function(r){r.classList.remove('clicked')});
  var pb = panel.querySelector('.panel-btn.pinned');
  if (pb) pb.classList.remove('pinned');
}

function attachPromptClicks() {
  // Click → only v2 (prompt panel)
  document.querySelectorAll('[id^="v2-"] tbody tr').forEach(function(row){
    if (row.classList.contains("prompt-row")) return;
    row.classList.add("prompt-row");
    var numCell = row.querySelector(".c-num");
    var shotNum = numCell.textContent.trim();
    row.setAttribute("data-shot", shotNum);
    row.addEventListener("click", function(e){
      if (e.target.closest("textarea") || e.target.closest(".ctx-menu") || e.target.closest("td:has(textarea)")) return;
      document.querySelectorAll(".prompt-row.clicked").forEach(function(r){r.classList.remove("clicked")});
      openPrompt(shotNum, row);
    });
  });
  // Context menu → all rows (v2 + beat)
  document.querySelectorAll('.scene-section .sub-content tbody tr').forEach(function(row){
    row.addEventListener("contextmenu", function(e){ showCtxMenu(e, row); });
  });
}


// 列宽拖拽
function bindColResize(thead){
  var ths = thead.querySelectorAll('th');
  var table = thead.closest('table');
  var colgroup = table.querySelector('colgroup');
  var cols = colgroup ? colgroup.querySelectorAll('col') : [];
  if (!cols.length) return;
  
  ths.forEach(function(th, i){
    if (i === ths.length - 1) return;
    if (th.querySelector('.col-resize')) return; // already bound
    var handle = document.createElement('div');
    handle.className = 'col-resize';
    th.style.position = 'relative';
    th.appendChild(handle);
    
    var startX, startW, resizing = false;
    handle.addEventListener('mousedown', function(e){
      resizing = true; startX = e.clientX;
        // Lock ALL columns in ALL tables to current pixel widths
        var sceneSection = table.closest('.scene-section'); if(sceneSection){ sceneSection.querySelectorAll('colgroup').forEach(function(cg){
          cg.querySelectorAll('col').forEach(function(c){
            if (!c.style.width) c.style.width = getComputedStyle(c).width;
          });
        })} 
        startW = parseFloat(cols[i].style.width);
        handle.classList.add('active');
        e.preventDefault(); e.stopPropagation();
      });
      document.addEventListener('mousemove', function(e){
        if (!resizing) return;
        var nw = Math.max(30, startW + e.clientX - startX);
        cols[i].style.width = nw + 'px';
        // Sync same column across ALL beat-section tables
        var sceneSection = table.closest('.scene-section'); if(sceneSection){ sceneSection.querySelectorAll('colgroup').forEach(function(cg){
          var allCols = cg.querySelectorAll('col');
          if (allCols[i] && allCols[i] !== cols[i]) allCols[i].style.width = nw + 'px';
        })} 
      });
      document.addEventListener('mouseup', function(){
        if (!resizing) return;
        resizing = false; handle.classList.remove('active');
      });
    });
}
(function(){
  document.querySelectorAll('.scene-section .sub-content table thead').forEach(bindColResize);
})();

// Attach clicks after initial load + auto-refresh from Feishu
document.addEventListener('DOMContentLoaded', function(){
  // Restore sidebar
  if (localStorage.getItem('sidebarOpen')==='true'){
    var s=document.getElementById('sidebar');if(s){s.classList.add('open');s.querySelector('.sidebar-toggle').textContent='◀';}
  }
  setTimeout(attachPromptClicks, 500);
  
  // Scene tab switching: re-bind handlers on tab change
  document.querySelectorAll('input[name=scene]').forEach(function(radio){
    radio.addEventListener('change', function(){
      activeScene = this.id.replace('scene-', '');
      setTimeout(attachPromptClicks, 100);
      // Re-bind column resize for new scene's tables
      setTimeout(function(){
        document.querySelectorAll('.scene-section .sub-content table thead').forEach(function(thead){
          if (thead.querySelector('.col-resize')) return; // already bound
          bindColResize(thead);
        });
      }, 200);
    });
  });
});
// Also attach after tab switch
document.querySelectorAll('[name=scene], [name^=sub-]').forEach(function(r){
  r.addEventListener('change', function(){ setTimeout(attachPromptClicks, 300); });
});
